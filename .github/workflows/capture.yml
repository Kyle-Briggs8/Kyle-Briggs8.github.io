name: Capture URL to garden note

on:
  repository_dispatch:
    types: [capture-url]
  workflow_dispatch:
    inputs:
      url:
        description: URL to capture
        required: true
      quick_thought:
        description: Optional quick thought (goes into "My thoughts")
        required: false
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

# No concurrency group: GitHub keeps only ONE pending run per group, so rapid
# bursts of captures silently cancelled the middle ones. Parallel runs are safe
# now — the commit step self-heals push races (rebase + strip repair).

jobs:
  capture:
    # Issue events only count when the capture form's label is present
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'capture')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Capture URL into a note
        id: capture
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/capture.py --from-event

      - name: Commit and push note
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "nothing to commit (duplicate capture, no new thought)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "capture: ${{ steps.capture.outputs.note_title }}"
          for i in 1 2 3 4 5; do
            if git push; then echo "committed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch origin v5
            if ! git rebase origin/v5; then
              # The only file concurrent writers share is the homepage strip
              # (content/index.md). Take the remote version and replay just
              # our card on top of it, then continue the rebase.
              git checkout origin/v5 -- content/index.md
              python scripts/capture.py --strip-add "content/notes/${{ steps.capture.outputs.note_slug }}.md"
              git add content/index.md
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
            sleep 3
          done
          echo "::error::could not push after 5 attempts"
          exit 1

      # Pushes made with GITHUB_TOKEN don't trigger the deploy workflow's
      # push event, so dispatch it explicitly (workflow_dispatch is exempt).
      - name: Trigger site deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref v5 -R ${{ github.repository }}

      - name: Reply and close issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.capture.outputs.duplicate }}" = "true" ]; then
            BODY="Already in the garden ♻️ → https://kyle-briggs8.github.io/notes/${{ steps.capture.outputs.note_slug }}"
          else
            BODY="Captured ✅ → https://kyle-briggs8.github.io/notes/${{ steps.capture.outputs.note_slug }} (live after the deploy finishes, ~1 min)"
          fi
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "$BODY"
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}
