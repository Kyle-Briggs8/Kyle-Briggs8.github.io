# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Kyle Briggs
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: goatcounter
    websiteId: kyle-briggs
  locale: en-US
  baseUrl: kyle-briggs8.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Space Grotesk
      body: Inter
      code: JetBrains Mono
    colors:
      # Catppuccin Latte (light) / Mocha (dark) — keeps graph, search, and
      # popover CSS vars in step with the quartz-themes catppuccin skin.
      lightMode:
        light: "#eff1f5"        # latte base
        lightgray: "#ccd0da"    # latte surface0
        gray: "#9ca0b0"         # latte overlay0
        darkgray: "#4c4f69"     # latte text
        dark: "#4c4f69"         # latte text
        secondary: "#1e66f5"    # latte blue
        tertiary: "#179299"     # latte teal
        highlight: "rgba(30, 102, 245, 0.11)"
        textHighlight: "#df8e1d44"  # latte yellow
      darkMode:
        light: "#1e1e2e"        # mocha base
        lightgray: "#313244"    # mocha surface0
        gray: "#6c7086"         # mocha overlay0
        darkgray: "#cdd6f4"     # mocha text
        dark: "#cdd6f4"         # mocha text
        secondary: "#89b4fa"    # mocha blue
        tertiary: "#94e2d5"     # mocha teal
        highlight: "rgba(137, 180, 250, 0.13)"
        textHighlight: "#f9e2af44"  # mocha yellow
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  # PRIVACY BOUNDARY (CLAUDE.md guardrail): fail-closed publish filter.
  # A page is built ONLY if frontmatter has `publish: true`. Never disable.
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 20
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      # Hide the garden's contents from the sidebar: notes are navigated via
      # the brain/graph/hub pages, not a folder listing. The Garden entry stays.
      filterFn: "(node) => node.slugSegment !== 'tags' && !(node.slugSegments[0] === 'notes' && node.slugSegments.length > 1)"
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    options:
      # Hubs are the cluster centers; tag nodes would duplicate them and
      # double the clutter, so tags stay hidden in both views.
      localGraph:
        depth: 1
        scale: 1.1
        showTags: false
        linkDistance: 30
        fontSize: 0.6
      globalGraph:
        depth: -1
        scale: 0.9
        showTags: false
        repelForce: 0.6
        centerForce: 0.4
        linkDistance: 40
        fontSize: 0.55
        opacityScale: 1.3
        focusOnHover: true
        enableRadial: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/Kyle-Briggs8
        LinkedIn: https://www.linkedin.com/in/kyle-briggs-/
        Email: mailto:kyl3.briggs@gmail.com
        RSS: https://kyle-briggs8.github.io/index.xml
# recent-notes stays disabled: it can't filter to notes/ from YAML (string filters
# unsupported), and an unfiltered list would mix blog posts into the garden strip.
# The homepage "recently in the garden" list is maintained by hand (Phase 3 pipeline
# will update it automatically).
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
# quartz-themes skin disabled: the site look is hand-rolled in
# quartz/styles/custom.scss to match /static/brain/ (owner preference).
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
