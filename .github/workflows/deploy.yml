name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Generate brain time-lapse metadata
        run: python3 scripts/brain_meta.py
      - name: Generate live OG card (brain-graph share image)
        run: |
          cp scripts/og-card.html public/og-card-src.html
          python3 -m http.server 8123 --directory public &
          sleep 2
          google-chrome --headless=new --screenshot=public/static/og-card.png \
            --window-size=1200,630 --hide-scrollbars --virtual-time-budget=10000 \
            http://localhost:8123/og-card-src.html
          rm public/og-card-src.html
          ls -la public/static/og-card.png
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # The Pages backend occasionally rejects deployments with a transient
      # "Deployment failed, try again later" — one automatic retry absorbs it.
      - name: Retry deploy (transient Pages failure)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
